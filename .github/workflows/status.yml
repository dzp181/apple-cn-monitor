name: apple-cn-status

# 只做一件事：把「全国直营店 × 全部机型」的库存快照发布到 ntfy 的 x-apple-status 主题，
# 供 X 监控配置台的详情页读取。与 apple.yml（降价 / 有货提醒）完全独立：
# 这条链路不写 state、不发提醒，失败也不影响提醒链路。

on:
  workflow_dispatch:
  schedule:
    # 与提醒链路（:30）错开 20 分钟，避免同一时段两个出口 IP 同时打苹果
    - cron: '10 * * * *'

permissions:
  contents: read

concurrency:
  group: apple-cn-status
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 49 家门店 × 1 个请求，按 1.2 秒节奏约 2.5 分钟；留足余量
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish store stock snapshot
        env:
          APPLE_NTFY_TOKEN: ${{ secrets.APPLE_NTFY_TOKEN }}
        run: python3 apple_push.py --status
